<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Seite nicht gefunden | KAPA Automobile</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(var(--header-height) + 40px) 24px 60px 24px;
    }
    .error-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-highlight);
      border-radius: var(--radius-md);
      padding: 56px 40px;
      max-width: 600px;
      width: 100%;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--bronze-500);
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -0.03em;
    }
    .error-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 16px;
    }
    .error-desc {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="header-logo-link" aria-label="Zurück zur Startseite">
        <img src="assets/images/logo.png" alt="KAPA Automobile" class="header-logo" width="160" height="52">
      </a>
      <nav class="nav-desktop">
        <ul class="nav-links">
          <li><a href="index.html#fahrzeuge" class="nav-link">Fahrzeuge</a></li>
          <li><a href="ankauf.html" class="nav-link">Fahrzeugankauf</a></li>
          <li><a href="index.html#kontakt" class="nav-link">Kontakt</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Error Content -->
  <main class="error-page-wrapper">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Seite nicht gefunden</h1>
      <p class="error-desc">
        Die von Ihnen aufgerufene Seite existiert leider nicht oder wurde verschoben.
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn-primary">
          <span>Zur Startseite</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
        <a href="ankauf.html" class="btn-secondary">
          <span>Kfz-Ankauf</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom-bar">
      <div class="footer-copyright">&copy; 2026 KAPA Automobile. Alle Rechte vorbehalten.</div>
    </div>
  </footer>
</body>
</html>
